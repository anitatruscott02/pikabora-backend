services:
  - type: web
    name: pikabora-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PIKABORA_ADMIN_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
